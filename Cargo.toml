[package]
name = "rustblox"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Open-source Roblox client built in Rust. wgpu-accelerated UI + 3D place renderer with live server join."
repository = "https://github.com/TumRedSun/rustblox"
keywords = ["roblox", "client", "rust", "gpl"]
categories = ["games", "network-programming"]

# Workspace: the mobile/ member carries the Android/iOS harness (cdylib +
# staticlib). Default members keep plain `cargo build` / `cargo test`
# desktop-only, exactly like before the mobile branch.
[workspace]
members = ["mobile"]
default-members = ["."]

[dependencies]
winit = "0.30.13"
wgpu = "29.0.4"
bytemuck = { version = "1.18", features = ["derive"] }
pollster = "0.4"
ab_glyph = "0.2.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"
flate2 = "1"
# Replication payload layer: the fork's big cluster bodies are zstd frames
# (`83 16`/`83 0d`/`83 13`/`8d 01`/`97 0d`) whose plaintext is the bit-packed
# replication stream. Pure Rust, no C build.
ruzstd = { version = "0.7.3", default-features = false, features = ["std"] }

# Early-encryption (handshake crypto, join hypothesis (c)): the fork OCR2
# carries an X25519 public key + an AEAD box, and the reply announces the
# session keys (libsodium crypto_kx shape). Pure-Rust stacks, no C build.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"
# Post-OpenReply2 steady layer: AES-256-GCM (live-verified; the engine uses
# AES-GCM with the "UniqueNumbeR" counter nonce, not ChaCha).
aes-gcm = "0.10"

# Desktop clipboard (arboard has no Android/iOS backend). wayland-data-control
# adds a native Wayland clipboard backend so Copy works under Wayland too,
# not only through XWayland.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

[lints.rust]
dead_code = "deny"
unused = "deny"

[lints.clippy]
# Deny-by-default: new code must not rely on these. Existing modules are
# migrated module-by-module (see docs/ARCHITECTURE.md); until a module is
# migrated it carries a local `#![allow(...)]` to opt back out.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
