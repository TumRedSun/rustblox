[package]
name = "rustblox"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Open-source Roblox client built in Rust. Milestone 1: account login and friends menu with live presence."
repository = "https://github.com/TumRedSun/rustblox"
keywords = ["roblox", "client", "rust", "gpl"]
categories = ["games", "network-programming"]

[dependencies]
winit = "0.30.13"
pixels = "0.17"
ab_glyph = "0.2.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"
arboard = "3.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
