# Nightly builds: every night (and on demand) RustBlox is compiled for all
# supported platforms; the release step republishes the rolling "nightly"
# GitHub Release (a full, non-prerelease release, so GitHub shows it as the
# "Latest" release on the repository page) and then triggers the mobile
# builds for the same night.
#
# Trigger manually: Actions -> Nightly builds -> Run workflow.

name: Nightly builds

on:
  schedule:
    # 02:00 UTC every day.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: rustblox
          # ARM64 Linux: GitHub offers free hosted ARM64 runners for public
          # repositories (ubuntu-24.04-arm).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: rustblox
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustblox.exe
          # ARM64 Windows: free hosted runner for public repositories
          # (windows-11-arm); rustup ships native aarch64-pc-windows-msvc
          # host tools.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: rustblox.exe
          # macos-14 was retired by GitHub on 2026-11-02 ("The configuration
          # 'macos-14-arm64-us-default' is not supported"); macos-15 is the
          # current ARM64 image.
          - os: macos-15
            target: aarch64-apple-darwin
            binary: rustblox
          # macos-13 was retired on 2025-12-04; macos-15-intel is the last
          # x86_64 image GitHub offers (supported until August 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: rustblox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="rustblox-${{ matrix.target }}"
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${NAME}${EXT}"
          cp README.md LICENSE dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -y "rustblox-nightly-${{ matrix.target }}.zip" "${NAME}${EXT}" README.md LICENSE
          else
            zip -q "rustblox-nightly-${{ matrix.target }}.zip" "${NAME}${EXT}" README.md LICENSE
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustblox-nightly-${{ matrix.target }}
          path: dist/rustblox-nightly-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish / refresh the rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout happens in this job, so tell gh which repository to
          # target instead of letting it probe the (missing) git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          NOTES=$(cat <<EOF
          Automated nightly build of \`main\` (${DATE}).

          Assets (all unofficial, may be unstable — see the README for sign-in instructions):

          | File | Platform |
          |------|----------|
          | \`rustblox-nightly-x86_64-unknown-linux-gnu.zip\` | Linux 64-bit |
          | \`rustblox-nightly-aarch64-unknown-linux-gnu.zip\` | Linux ARM64 |
          | \`rustblox-nightly-x86_64-pc-windows-msvc.zip\` | Windows 64-bit |
          | \`rustblox-nightly-aarch64-pc-windows-msvc.zip\` | Windows ARM64 |
          | \`rustblox-nightly-aarch64-apple-darwin.zip\` | macOS Apple Silicon |
          | \`rustblox-nightly-x86_64-apple-darwin.zip\` | macOS Intel |
          EOF
          )
          # Recreate the release from scratch so the "nightly" tag always
          # points at the exact commit that was built.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # A half-deleted release can leave the tag behind; drop it too.
          curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GH_REPO}/git/refs/tags/nightly" || true
          # Full (non-prerelease) release => GitHub badges it as "Latest"
          # and /releases/latest resolves to it right from the repo page.
          gh release create nightly --target "${GITHUB_SHA}" --latest \
            --title "Nightly build (${DATE})" --notes "$NOTES"
          gh release upload nightly artifacts/*.zip --clobber
          echo "Nightly release refreshed for ${DATE}."
      - name: Trigger the nightly mobile build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run mobile.yml --ref mobile
